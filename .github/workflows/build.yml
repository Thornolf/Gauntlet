name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libogre-1.12-dev libois-dev libsfml-dev
      - name: Build
        run: |
          cmake --preset linux
          cmake --build --preset linux -j

  windows:
    runs-on: windows-2022
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-cache
    steps:
      - uses: actions/checkout@v4
      - name: Get vcpkg
        shell: bash
        run: |
          git clone https://github.com/microsoft/vcpkg "$VCPKG_ROOT"
          "$VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg-cache
          key: vcpkg-${{ hashFiles('vcpkg.json') }}
      - name: Build
        run: |
          cmake --preset windows
          cmake --build --preset windows
      - name: Package (installer + zip)
        run: cpack --config build/CPackConfig.cmake -C Release
      - uses: actions/upload-artifact@v4
        with:
          name: Gauntlet-windows
          path: |
            build/packages/Gauntlet-Setup.exe
            build/packages/Gauntlet-portable.zip
      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/packages/Gauntlet-Setup.exe
            build/packages/Gauntlet-portable.zip
